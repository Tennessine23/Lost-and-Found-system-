<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daystar Lost &amp; Found</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Design tokens ---------- */
:root{
  --navy:#0B2A5B; --navy-l:#DCE6F7;
  --gold:#F2B705; --gold-l:#FFF4CC; --gold-d:#7A5600;
  --ink:#0F172A; --sub:#64748B; --line:#E2E8F0; --bg:#F5F7FA; --white:#fff;
  --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{flex:none}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar (laptop) / Tab bar (mobile) ---------- */
.sidebar{display:none;width:240px;flex:none;background:var(--white);border-right:1px solid var(--line);padding:28px 20px;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:12px}
.logo-img{width:44px;height:44px;display:block;flex:none}
.logo b{display:block;color:var(--navy);font-size:15px;white-space:nowrap}.logo small{color:var(--sub);font-size:12px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:6px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:var(--sub);font-weight:500;text-decoration:none;font-size:14px}
.nav a.on{background:var(--navy-l);color:var(--navy);font-weight:600}
.help{margin-top:auto;background:var(--gold-l);color:var(--gold-d);padding:16px;border-radius:16px;font-size:12px;display:grid;gap:6px}
.help b{font-size:14px}
.tabbar{position:fixed;inset:auto 0 0 0;background:var(--white);border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.tabbar a{display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--sub);text-decoration:none;min-width:56px}
.tabbar a .pill{width:48px;height:32px;border-radius:16px;display:grid;place-items:center}
.tabbar a.on{color:var(--navy);font-weight:600}
.tabbar a.report .pill{background:var(--navy)}

/* ---------- Main ---------- */
main{flex:1;min-width:0;padding:28px 20px 110px;max-width:1280px}
.topbar{display:flex;gap:16px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:0 16px}
.search input{flex:1;border:0;outline:0;padding:15px 0;background:none}
.search:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-l)}
.user{display:none;align-items:center;gap:10px;font-weight:600;font-size:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
h1{font-size:28px;line-height:1.2;font-weight:700}
.lead{color:var(--sub);margin-top:4px}
.view{display:none}.view.on{display:block}
#home.on{display:flex;flex-direction:column}
.back{display:flex;align-items:center;gap:14px;margin-bottom:20px;font-size:20px;font-weight:700}
.back button{width:40px;height:40px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center}

/* Action tiles */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.tile{display:flex;flex-direction:column;gap:12px;text-align:left;padding:16px;border-radius:20px;transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.tile i{font-style:normal}.tile b{font-size:16px;display:block}.tile span{font-size:13px}
.tile.lost{background:var(--gold-l);color:var(--gold-d)}.tile.lost .ic{background:var(--gold)}
.tile.found{background:var(--navy);color:#fff}.tile.found span{color:var(--navy-l)}.tile.found .ic{background:#fff}

/* Chips, badges */
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.row h2{font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{padding:9px 16px;border-radius:100px;background:var(--white);border:1px solid var(--line);color:var(--sub);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.badge{display:inline-block;padding:4px 10px;border-radius:100px;font-size:12px;font-weight:600}
.badge.found{background:var(--navy-l);color:var(--navy)}.badge.lost{background:var(--gold-l);color:var(--gold-d)}
.badge.approved{background:var(--navy-l);color:var(--navy)}
.badge.pending{background:var(--gold-l);color:var(--gold-d)}
.badge.rejected{background:#EEF2F6;color:var(--sub)}
.badge.returned{background:var(--navy);color:#fff}

/* Item cards */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{display:flex;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:left;width:100%;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(11,42,91,.08);transform:translateY(-2px)}
.thumb{width:72px;height:72px;border-radius:16px;display:grid;place-items:center;flex:none;overflow:hidden}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover}
.thumb.found{background:var(--navy-l);color:var(--navy)}.thumb.lost{background:var(--gold-l);color:var(--gold-d)}
.card .body{display:grid;gap:5px;min-width:0}
.card h3{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:13px}
.card .when{display:none;color:var(--sub);font-size:12px}
.empty{padding:40px 0;text-align:center;color:var(--sub);grid-column:1/-1}

/* Details */
.detail{display:grid;gap:16px}
.hero{height:180px;border-radius:24px;display:grid;place-items:center;overflow:hidden}
.hero.found{background:var(--navy-l);color:var(--navy)}.hero.lost{background:var(--gold-l);color:var(--gold-d)}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title-row h1{font-size:24px}
.info{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}
.info div{display:flex;gap:12px;align-items:center;font-weight:500;color:var(--ink)}
.info svg{color:var(--navy)}
.desc{color:var(--sub);line-height:1.6}
.held{background:var(--navy-l);color:var(--navy);padding:14px 16px;border-radius:16px;display:flex;gap:12px;align-items:center}
.held b{display:block;font-size:14px}.held span{font-size:13px}
.btns{display:flex;gap:12px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:16px 22px;border-radius:14px;font-weight:600;font-size:16px}
.btn.primary{background:var(--navy);color:#fff;flex:1}.btn.primary:hover{background:#0a2350}
.btn.ghost{background:var(--white);border:1px solid var(--line);color:var(--navy);font-size:14px}
.btn.outline{background:var(--white);border:1px solid var(--line);color:var(--navy);font-size:14px}
.btn.danger{background:#FEE4E2;color:#B42318;font-size:14px}
.btn.sm{padding:9px 16px;font-size:13px;border-radius:10px;flex:none}
.btn:disabled{opacity:.6;cursor:default}

/* Form */
.layout{display:grid;gap:16px}
.form{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:20px;display:grid;gap:18px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:11px;border-radius:11px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--navy);color:#fff}
.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:600}
.input{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--white)}
.input:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-l)}
.input svg{color:var(--sub)}
.input input,.input select{flex:1;border:0;outline:0;padding:15px 0;background:none;min-width:0}
.textarea-box{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--white);width:100%;min-height:84px;resize:vertical;outline:0}
.textarea-box:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-l)}
.two{display:grid;gap:16px}
.upload{border:1.5px dashed var(--navy);background:var(--navy-l);color:var(--navy);border-radius:20px;padding:24px 16px;display:grid;justify-items:center;gap:6px;font-weight:600;cursor:pointer;text-align:center}
.upload small{font-weight:400;font-size:12px}
.upload img.preview{max-height:140px;border-radius:12px;object-fit:cover;margin-bottom:4px}
.tip{background:var(--gold-l);color:var(--gold-d);border-radius:20px;padding:18px 20px;display:grid;gap:8px;font-size:13px}
.tip b{font-size:14px}

/* Browse, My items, Profile, Admin */
.page-h{font-size:28px}
#browse.on,#profile.on,#admin.on{display:grid;gap:16px;align-content:start}
#browse .topbar{margin:0}
.user-slot{display:contents}
a.user{color:inherit;text-decoration:none}
.count{color:var(--sub);font-size:13px}
a.see{text-decoration:none}
.list{display:grid;gap:12px;max-width:760px}
.list.wide{max-width:none}
.card.flat .thumb{width:56px;height:56px}
.card.flat .badge{margin-left:auto;white-space:nowrap}
.sub-h{font-size:18px;margin:22px 0 12px}
.note,.banner{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.5}
.note{background:var(--gold-l);color:var(--gold-d)}
.note.ok,.banner{background:var(--navy-l);color:var(--navy)}
.banner b{display:block}
.by{color:var(--sub);font-size:13px}
.err{color:#B42318;font-size:13px}
.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Auth & Profile */
.auth{max-width:420px;margin:12px auto 0;display:grid;gap:16px}
.auth h1{font-size:26px}
.lead2{color:var(--sub);font-size:14px}
.form-col{display:grid;gap:16px}
.who{display:flex;align-items:center;gap:14px}
.who h1{font-size:22px;overflow-wrap:anywhere}
.avatar.big{width:56px;height:56px;font-size:18px}
.role{justify-self:start}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pstat{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;color:var(--sub);font-size:13px;font-weight:500}
.pstat b{display:block;font-size:26px;color:var(--navy);line-height:1.1}
.auth .btn.primary{flex:none}

/* Admin */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px;color:var(--sub);font-size:13px;font-weight:500}
.stat b{display:block;font-size:28px;color:var(--navy);line-height:1.1;margin-bottom:2px}
.rowcard{display:flex;gap:14px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:14px;flex-wrap:wrap}
.rowcard .main{flex:1;min-width:200px;display:grid;gap:6px}
.rowcard h3{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.rowcard h3 a{color:inherit;text-decoration:none}.rowcard h3 a:hover{text-decoration:underline}
.rowcard blockquote{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;overflow-wrap:anywhere}
.meta2{font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.racts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--white);font-size:13px}
.thumb.sm{width:56px;height:56px}

/* Dialog */
dialog{border:0;border-radius:20px;padding:24px;width:min(460px,92vw);box-shadow:0 24px 60px rgba(15,23,42,.25);margin:auto}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-form{display:grid;gap:12px}
.dlg-form h3{font-size:18px}
.dlg-form label{font-size:14px;color:var(--sub)}
.dlg-form textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:110px;resize:vertical;outline:0}
.dlg-form textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-l)}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end}
.dlg-btns .btn{flex:none;padding:12px 20px;font-size:14px}

/* ---------- Mobile-specific ---------- */
.home-head{order:-2}.topbar{order:-1;margin:18px 0 0}
.greet{color:var(--sub);font-weight:500;font-size:14px;margin-bottom:4px}
.lead,.chips-desk{display:none}
.chips-mob{margin:0 0 18px}
.row{margin:0 0 14px}
.see{color:var(--navy);font-weight:600;font-size:14px;margin-left:auto}.see:hover{text-decoration:underline}
.m-only{display:inline}.d-only{display:none}
.hero svg{width:72px;height:72px}
.btns{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom));z-index:6}
.btn.ghost{width:56px;height:56px;padding:0;border-radius:16px;order:-1}.btn.ghost span{display:none}
body.on-details .tabbar{display:none}
body.on-details main{padding-bottom:130px}
.layout{display:flex;flex-direction:column;gap:18px}
.form,.side{display:contents}
.seg{order:1}.upload{order:2}.f-name{order:3}.f-cat{order:4}.two{order:5}.f-desc{order:6}.f-err{order:7}.btn.submit{order:8}.tip{order:9}
.actions{margin:18px 0}
.tip{display:none}

/* ---------- Laptop layout ---------- */
@media (min-width:900px){
  .sidebar{display:flex}.tabbar{display:none}
  main{padding:32px 40px}
  .topbar{order:-2;margin:0 0 24px}.home-head{order:-1}
  .greet,.chips-mob,.see{display:none}
  .chips-desk{display:flex}.lead{display:block}
  .row{margin:6px 0 14px}
  .m-only{display:none}.d-only{display:inline}
  .hero svg{width:120px;height:120px}
  .btns{position:static;border:0;background:none;padding:0;z-index:auto}
  .btn.ghost{width:auto;height:auto;padding:16px 22px;border-radius:14px;order:0}.btn.ghost span{display:inline}
  body.on-details main{padding-bottom:32px}
  .layout{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
  .form{display:grid;padding:28px}.side{display:grid;gap:16px}.tip{display:grid}
  .actions{margin:20px 0 28px;gap:20px}
  .user{display:flex}
  h1,.page-h{font-size:32px}
  .tile{flex-direction:row;align-items:center;gap:16px;padding:18px 20px}
  .tile .ic{width:48px;height:48px}.tile b{font-size:18px}
  .grid{grid-template-columns:repeat(3,1fr);gap:20px}
  .card{flex-direction:column;align-items:stretch;gap:12px;position:relative}
  .card .thumb{width:100%;height:112px;border-radius:14px}
  .card .body{padding:0 4px 4px}
  .card .when{display:block}
  .mobile-time{display:none}
  .card.flat{flex-direction:row;align-items:center;gap:14px}
  .card.flat .thumb{width:56px;height:56px}
  .card.flat .body{padding:0}
  .detail{grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .hero{height:420px}.title-row h1{font-size:30px}
  .two{grid-template-columns:1fr 1fr}
  .toast{bottom:40px}
  .auth{margin-top:40px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:32px}
  .profile-wrap{max-width:520px}
  .stats{grid-template-columns:repeat(5,1fr)}
}
.card .badge-line{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
